[package]
name = 'polyglotsql'
publish = false
version = '0.1.0'
edition = '2021'
# Keep in sync with DESCRIPTION SystemRequirements.
# This is the maximum rust-version declared across all vendored dependencies
# (currently ar_archive_writer 0.5.2 -> 1.88); re-verify after updating the
# vendor tree (see tools/update-vendor.sh).
rust-version = '1.88'

[lib]
crate-type = ['rlib', 'staticlib']
name = 'polyglotsql'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = '0.9'
serde_json = '1.0'

[dependencies.polyglot-sql]
version = '0.13.2'
default-features = false
features = [
  'all-dialects',
  'transpile',
  'semantic',
  'openlineage',
  'diff',
  'stacker',
]

[profile.release]
# Tuned for build cost on CRAN machines: the macOS x86_64 builders stop after
# 30 minutes and the linux-arm64 checker ran out of memory with full LTO and a
# single codegen unit. Size-optimised code without LTO halves the build time
# and cuts peak rustc memory by about a quarter.
opt-level = 's'
lto = false
codegen-units = 16
# Panics must unwind so that extendr can catch them at the FFI boundary and
# convert them into R errors instead of aborting the R session.
panic = 'unwind'
